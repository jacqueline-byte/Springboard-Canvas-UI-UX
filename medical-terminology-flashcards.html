<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medical Terminology: Mixed Set Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#0455F6; --blue75:#DEEBFF;
    --purple:#7E43D0; --purple50:#F0E6FF;
    --leaf:#C3F570; --leaf100:#DCFBDA; --leaf50:#F4FDEC;
    --gray:#D7D7DC; --navy:#0B2540; --white:#FFFFFF;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:"Manrope","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
    color:var(--navy);
    background:var(--blue75);
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;cursor:pointer;border:0}
  button:focus-visible,.card:focus-visible{outline:3px solid var(--blue);outline-offset:4px}

  /* ---------- blurred topic world ---------- */
  .world{position:fixed;inset:0;z-index:0;overflow:hidden}
  .layer{position:absolute;inset:-60px;opacity:0;transition:opacity 1.1s ease;filter:blur(16px) saturate(1.1)}
  .layer.on{opacity:1}
  .layer svg{width:100%;height:100%;display:block}
  .drift{animation:drift 14s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
  .drift.slow{animation-duration:20s}
  .drift.rev{animation-direction:alternate-reverse}
  @keyframes drift{from{transform:translate(-18px,10px) rotate(-3deg)}to{transform:translate(22px,-14px) rotate(3deg)}}
  .rise{animation:rise 9s linear infinite;transform-box:fill-box}
  @keyframes rise{from{transform:translateY(120px);opacity:0}20%{opacity:.9}to{transform:translateY(-520px);opacity:0}}
  .needle{animation:swing 6s ease-in-out infinite alternate;transform-origin:600px 420px}
  @keyframes swing{from{transform:rotate(-38deg)}to{transform:rotate(30deg)}}
  .mercury{animation:fill 5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:bottom}
  @keyframes fill{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
  .veil{position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.55),rgba(222,235,255,.25) 55%,rgba(240,230,255,.35))}

  /* ---------- shell ---------- */
  .app{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;padding:14px 20px 12px;max-width:860px;margin:0 auto}
  .top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
  .deck-title{margin:0;font-size:clamp(18px,2.6vw,24px);font-weight:800;letter-spacing:-.01em;line-height:1.15}
  .deck-sub{display:inline-block;margin-top:6px;font-size:13px;font-weight:700;color:var(--navy);background:var(--leaf);padding:3px 10px;border-radius:999px}
  .tools{display:flex;gap:8px;flex-shrink:0}
  .icon-btn{min-width:64px;padding:7px 8px 6px;border-radius:14px;background:rgba(255,255,255,.7);color:var(--blue);display:flex;flex-direction:column;align-items:center;gap:3px;transition:transform .2s,background .2s}
  .icon-btn span{font-size:11px;font-weight:700;line-height:1}
  .icon-btn:hover{background:#fff;transform:translateY(-2px)}
  .icon-btn svg{width:20px;height:20px}

  .progress{margin-top:12px;display:flex;align-items:center;gap:12px}
  .track{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.65);overflow:hidden}
  .bar{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--purple));transition:width .5s cubic-bezier(.2,.8,.2,1)}
  .count{font-size:14px;font-weight:700;min-width:64px;text-align:right}
  .dots{display:flex;gap:6px;margin-top:10px}
  .dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.75);border:2px solid transparent;transition:all .3s}
  .dot.here{border-color:var(--blue);transform:scale(1.25)}
  .dot.known{background:var(--leaf)}
  .dot.learning{background:var(--purple)}

  /* topic banner */
  .topic{margin:12px 0 6px;height:34px;position:relative}
  .topic span{position:absolute;left:0;top:0;display:inline-flex;align-items:center;gap:10px;font-size:clamp(19px,2.6vw,24px);font-weight:800;color:var(--blue);letter-spacing:-.01em}
  .topic span::before{content:"";width:12px;height:12px;border-radius:4px;background:var(--leaf);box-shadow:0 0 0 4px rgba(195,245,112,.35)}
  .topic span.in{animation:topicIn .7s cubic-bezier(.2,.8,.2,1) both}
  @keyframes topicIn{from{opacity:0;transform:translateX(-24px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}

  /* ---------- the card ---------- */
  .stage{flex:1;display:flex;flex-direction:column;justify-content:center}
  .card{perspective:1600px;outline:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .inner{display:grid;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,1.35,.45,1)}
  .card.flipped .inner{transform:rotateY(180deg)}
  .face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:28px;position:relative;overflow:hidden;min-height:260px;display:flex;flex-direction:column;padding:18px 26px 20px}
  .front{
    background:
      linear-gradient(115deg,transparent 0 58%,rgba(255,255,255,.95) 58% 58.4%,rgba(222,235,255,.55) 58.4% 100%),
      linear-gradient(62deg,transparent 0 70%,rgba(255,255,255,.95) 70% 70.4%,rgba(240,230,255,.6) 70.4% 100%),
      linear-gradient(145deg,rgba(255,255,255,.92),rgba(255,255,255,.78));
    box-shadow:0 30px 60px -28px rgba(4,85,246,.45),inset 0 0 0 1px rgba(255,255,255,.9);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  }
  .back{
    transform:rotateY(180deg);color:#fff;
    background:linear-gradient(135deg,#2E6FF8 0%,var(--blue) 45%,#3D3FD9 80%,var(--purple) 125%);
    box-shadow:0 30px 60px -24px rgba(126,67,208,.6);
  }
  .back::after{content:"";position:absolute;inset:0;background:linear-gradient(150deg,rgba(255,255,255,.2),rgba(255,255,255,0) 45%);pointer-events:none}
  .side{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;position:relative;z-index:2}
  .side b{padding:4px 12px;border-radius:999px}
  .front .side b{background:var(--blue75);color:var(--blue)}
  .back .side b{background:rgba(255,255,255,.16);color:#fff}
  .hint{opacity:.6;font-weight:600}
  .body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;position:relative;z-index:2;padding:10px 4px 30px}
  .label{align-self:center;background:var(--leaf);color:var(--blue);font-weight:800;font-size:clamp(17px,2.4vw,24px);padding:2px 10px}
  .back .label{color:var(--navy)}
  .line{margin:0;text-align:center;font-weight:700;font-size:clamp(18px,2.6vw,26px);line-height:1.3;text-wrap:balance}
  .line.big{font-size:clamp(32px,5.4vw,52px);font-weight:800;letter-spacing:-.01em}
  .blank{display:inline-block;min-width:3.2em;height:.95em;vertical-align:-.12em;border-bottom:4px solid var(--navy);position:relative;overflow:hidden}
  .blank::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:4px;background:linear-gradient(90deg,transparent,var(--purple),transparent);animation:scan 2.2s ease-in-out infinite}
  @keyframes scan{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
  .ans{display:inline-block;color:var(--leaf);position:relative}
  .ans::after{content:"";position:absolute;left:-.12em;right:-.12em;bottom:.02em;height:.22em;background:rgba(195,245,112,.3);border-radius:4px;transform-origin:left;transform:scaleX(0)}
  .card.flipped .ans{animation:pop .7s .45s cubic-bezier(.3,1.6,.5,1) both}
  .card.flipped .ans::after{animation:under .5s .8s ease-out both}
  @keyframes pop{0%{opacity:0;transform:translateY(.35em) scale(.6);filter:blur(4px)}100%{opacity:1;transform:none;filter:none}}
  @keyframes under{to{transform:scaleX(1)}}
  .example{align-self:center;margin:4px 0 0;font-size:16px;font-weight:600;background:rgba(255,255,255,.14);padding:8px 16px;border-radius:14px}
  .card.flipped .example{animation:fadeUp .5s 1s both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* tables + diagrams (table/diagram cards) */
  .ftable{width:100%;border-collapse:separate;border-spacing:0 5px;font-size:clamp(13.5px,1.6vw,16px);font-weight:700;line-height:1.25}
  .ftable th,.ftable td{padding:7px 14px;text-align:left}
  .ftable td + td,.ftable th + th{text-align:center}
  .ftable tr > :first-child{border-radius:10px 0 0 10px}
  .ftable tr > :last-child{border-radius:0 10px 10px 0}
  .front .ftable td{background:rgba(222,235,255,.75)}
  .front .ftable th{background:var(--blue);color:#fff}
  .back .ftable td{background:rgba(255,255,255,.13)}
  .back .ftable th{background:rgba(255,255,255,.24);color:#fff}
  .q{color:var(--purple);font-weight:800}
  .body.tight{padding-bottom:10px}
  .nha{margin:0;align-self:center;display:flex;flex-direction:column;align-items:flex-end}
  .nha-wrap{position:relative;height:240px}
  .nha-wrap img{display:block;height:100%;width:auto;border-radius:12px;background:#fff;user-select:none}
  .nha figcaption{margin-top:4px;font-size:11px;font-style:italic;font-weight:600;opacity:.75}
  .mark{position:absolute;box-sizing:border-box;display:flex;align-items:center;justify-content:center;padding:0 7px;white-space:nowrap;border-radius:6px;border:2px solid var(--leaf);background:linear-gradient(135deg,#3A78FA,var(--blue) 60%,#3D3FD9);font-size:12px;font-weight:800;line-height:1}
  .mark .ans{display:inline}
  .mark .ans::after{display:none}
  /* bottom-right line motifs on the back */
  .motif{position:absolute;right:16px;bottom:14px;width:96px;height:81px;z-index:1;opacity:.55;pointer-events:none}

  /* entrance when card changes */
  .card.enter-next{animation:enterNext .55s cubic-bezier(.2,.8,.2,1)}
  .card.enter-prev{animation:enterPrev .55s cubic-bezier(.2,.8,.2,1)}
  @keyframes enterNext{from{opacity:0;transform:translateX(60px) rotate(2deg)}to{opacity:1;transform:none}}
  @keyframes enterPrev{from{opacity:0;transform:translateX(-60px) rotate(-2deg)}to{opacity:1;transform:none}}

  /* ---------- controls ---------- */
  .controls{margin-top:14px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
  .nav{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.75);color:var(--blue);display:grid;place-items:center;transition:transform .2s,background .2s}
  .nav:hover:not(:disabled){background:#fff;transform:scale(1.07)}
  .nav:disabled{opacity:.35;cursor:default}
  .nav svg{width:22px;height:22px}
  .flip-btn{height:46px;padding:0 28px;border-radius:999px;font-weight:800;font-size:18px;color:#fff;background:linear-gradient(135deg,#3A78FA,var(--blue) 60%,#3D3FD9);box-shadow:0 12px 24px -12px rgba(4,85,246,.8);transition:transform .2s}
  .flip-btn:hover{transform:translateY(-2px)}
  .rate{display:flex;gap:10px;justify-content:center;margin-top:10px;min-height:46px;opacity:0;transform:translateY(8px);pointer-events:none;transition:all .35s}
  .rate.show{opacity:1;transform:none;pointer-events:auto}
  .rate button{height:46px;padding:0 20px;border-radius:999px;font-weight:700;font-size:17px;transition:transform .2s}
  .rate button:hover{transform:translateY(-2px)}
  .learning-btn{background:var(--purple50);color:var(--purple)}
  .known-btn{background:var(--leaf);color:var(--navy)}
  .rate button{display:inline-flex;align-items:center;gap:8px}
  .count-badge{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 7px;border-radius:999px;font-size:13px;font-weight:800;line-height:1}
  .learning-btn .count-badge{background:var(--purple);color:#fff}
  .known-btn .count-badge{background:var(--navy);color:var(--leaf)}
  .count-badge.bump{animation:bump .5s cubic-bezier(.3,1.8,.5,1)}
  @keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.45)}100%{transform:scale(1)}}
  .fly{position:fixed;z-index:40;pointer-events:none;border-radius:20px;transform-origin:0 0}
  .fly.known{background:linear-gradient(135deg,var(--leaf),var(--leaf100))}
  .fly.learning{background:linear-gradient(135deg,var(--purple),#B58BEA)}
  .keys{text-align:center;margin-top:8px;font-size:12px;opacity:.6}

  /* ---------- intro & finish screens ---------- */
  .screen{position:fixed;inset:0;z-index:5;background:rgba(222,235,255,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:24px;transition:opacity .6s,visibility .6s}
  .screen.hide{opacity:0;visibility:hidden}
  .panel{position:relative;width:min(720px,100%);border-radius:32px;padding:44px 40px 40px;overflow:hidden;
    background:linear-gradient(140deg,rgba(255,255,255,.9),rgba(255,255,255,.7));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 40px 80px -30px rgba(4,85,246,.5)}
  .panel h1{margin:0;font-size:clamp(36px,6.5vw,64px);line-height:1.02;font-weight:800;letter-spacing:-.025em;max-width:11ch}
  .panel h2{margin:0;font-size:clamp(30px,5vw,48px);font-weight:800;letter-spacing:-.02em}
  .squiggle{position:absolute;right:-10px;top:40px;width:min(320px,48%);height:auto}
  .squiggle path{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 2.4s .3s cubic-bezier(.6,0,.2,1) forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .panel .fc{display:block;margin:70px 0 28px auto;width:max-content;font-size:clamp(30px,5vw,50px);font-weight:800;color:var(--blue);opacity:0;animation:fadeUp .7s 1.6s both}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .start{height:54px;padding:0 30px;border-radius:999px;font-weight:800;font-size:17px;color:#fff;background:linear-gradient(135deg,#3A78FA,var(--blue) 55%,var(--purple));box-shadow:0 14px 28px -12px rgba(4,85,246,.85);transition:transform .2s}
  .start:hover{transform:translateY(-2px) scale(1.02)}
  .ghost{height:54px;padding:0 24px;border-radius:999px;font-weight:700;font-size:16px;background:var(--purple50);color:var(--purple)}
  .meta{font-size:14px;opacity:.7}
  .resume{margin:0 0 6px;padding:14px 18px;border-radius:18px;background:var(--leaf50);box-shadow:inset 0 0 0 1px var(--leaf100);font-size:16px}
  .resume b{font-weight:800;color:var(--blue)}
  .resume[hidden],.row[hidden]{display:none}
  .score{display:flex;align-items:center;gap:28px;margin:26px 0 30px;flex-wrap:wrap}
  .ring{width:150px;height:150px;flex-shrink:0}
  .ring circle{fill:none;stroke-width:14}
  .ring .val{stroke:url(#ringGrad);stroke-linecap:round;transform:rotate(-90deg);transform-origin:center;transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1)}
  .ring text{font-size:30px;font-weight:800;fill:var(--navy)}
  .tally{display:grid;gap:10px;font-size:17px;font-weight:700}
  .tally span{display:inline-flex;align-items:center;gap:10px}
  .tally i{width:14px;height:14px;border-radius:5px;display:inline-block}


  /* ---------- feedback on the finish screen ---------- */
  #finish .panel{max-height:calc(100vh - 32px);overflow:auto}
  .fbk{margin-top:22px;padding:16px 18px;border-radius:20px;background:var(--leaf50);box-shadow:inset 0 0 0 1px var(--leaf100)}
  .fbk[hidden]{display:none}
  .fbk h3{margin:0 0 10px;font-size:17px;font-weight:800}
  .moods{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .mood{height:42px;padding:0 16px;border-radius:999px;background:#fff;color:var(--navy);font-weight:700;font-size:15px;box-shadow:inset 0 0 0 1.5px var(--gray);transition:all .2s}
  .mood:hover{box-shadow:inset 0 0 0 1.5px var(--blue)}
  .mood.on{background:var(--blue);color:#fff;box-shadow:none}
  .fbk-row{display:flex;gap:8px;flex-wrap:wrap}
  .fbk input,.fbk textarea{font:inherit;font-size:15px;color:var(--navy);border:0;border-radius:14px;padding:10px 14px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--gray);outline:none}
  .fbk input:focus,.fbk textarea:focus{box-shadow:inset 0 0 0 2px var(--blue)}
  .fbk input{flex:1 1 180px;min-width:0}
  .fbk textarea{width:100%;min-height:42px;height:42px;resize:vertical;margin-top:8px}
  .fbk .send{height:42px;padding:0 22px;border-radius:999px;font-weight:800;font-size:15px;color:#fff;background:linear-gradient(135deg,#3A78FA,var(--blue) 60%,#3D3FD9)}
  .fbk .send:disabled{opacity:.5;cursor:default}
  .mood.thumb{width:64px;height:52px;padding:0;font-size:26px;border-radius:16px}
  .mood.thumb.on{background:var(--leaf);box-shadow:inset 0 0 0 2px var(--navy)}
  .fbk-msg{margin:8px 0 0;font-size:13.5px;font-weight:700;min-height:18px}
  .fbk-msg.err{color:var(--purple)}
  .fbk-done{font-size:16px;font-weight:700}
  /* compact finish screen so score + feedback fit without scrolling */
  #finish .panel{padding:28px 32px 26px}
  #finish .score{margin:12px 0 14px}
  #finish .ring{width:112px;height:112px}
  .fbk{margin-top:14px;padding:14px 16px}
  .fbk h3{margin:0 0 8px;font-size:16px}
  .moods{margin-bottom:10px}
  .mood{height:38px;font-size:14.5px}
  .fbk input,.fbk .send{height:40px}
  .fbk textarea{margin-top:6px;min-height:40px;height:40px}
  .confetti{position:fixed;top:-20px;width:10px;height:16px;border-radius:3px;z-index:6;pointer-events:none;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

  @media (max-width:560px){
    .face{padding:20px 18px 24px;min-height:300px}
    .panel{padding:32px 24px 28px}
    .hint{display:none}
    .keys{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  }

  /* ===== Medical Terminology: purple-forward palette ===== */
  body{background:var(--purple50)}
  .veil{background:linear-gradient(160deg,rgba(255,255,255,.5),rgba(240,230,255,.35) 55%,rgba(222,235,255,.3))}
  button:focus-visible,.card:focus-visible{outline-color:var(--purple)}
  .icon-btn,.nav{color:var(--purple)}
  .bar{background:linear-gradient(90deg,var(--purple),#B58BEA)}
  .topic span{color:var(--purple)}
  .front .side b{background:var(--purple50);color:var(--purple)}
  .front{background:
      linear-gradient(115deg,transparent 0 58%,rgba(255,255,255,.95) 58% 58.4%,rgba(240,230,255,.6) 58.4% 100%),
      linear-gradient(62deg,transparent 0 70%,rgba(255,255,255,.95) 70% 70.4%,rgba(222,235,255,.45) 70.4% 100%),
      linear-gradient(145deg,rgba(255,255,255,.93),rgba(255,255,255,.8));
    box-shadow:0 30px 60px -28px rgba(126,67,208,.5),inset 0 0 0 1px rgba(255,255,255,.9)}
  .back{background:linear-gradient(135deg,#A774E6 0%,var(--purple) 45%,#5B2FB0 85%,#3D3FD9 125%)}
  .flip-btn,.start,.fbk .send{background:linear-gradient(135deg,#A774E6,var(--purple) 60%,#5B2FB0)}
  .flip-btn{box-shadow:0 12px 24px -12px rgba(126,67,208,.85)}
  .start{box-shadow:0 14px 28px -12px rgba(126,67,208,.85)}
  .panel .fc,.resume b{color:var(--purple)}
  .dot.here{border-color:var(--purple)}
  .mood.on{background:var(--purple)}
  /* this deck has no topic headings */
  #topic{display:none}
  .topic:empty{display:none}   /* this deck has no topic headers */
  /* term cards */
  .term-word{margin:0;text-align:center;font-weight:800;font-size:clamp(40px,7vw,76px);letter-spacing:-.01em;line-height:1.1;color:var(--navy);word-break:break-word}
  .term-img{display:inline-block;height:clamp(70px,12vw,110px);width:auto;vertical-align:middle}
  .term-chip{align-self:center;display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border-radius:999px;background:rgba(255,255,255,.18);color:#fff;font-weight:800;font-size:clamp(18px,2.4vw,24px)}
  .term-chip img{height:28px;width:auto;filter:brightness(0) invert(1)}
  .term-meaning{margin:0;text-align:center;font-weight:800;font-size:clamp(24px,3.8vw,40px);line-height:1.25;text-wrap:balance}
</style>
</head>
<body>

<!-- blurred topic backgrounds get injected here -->
<div class="world" id="world"><div class="veil"></div></div>

<main class="app" id="app" aria-live="polite">
  <div class="top">
    <div>
      <h1 class="deck-title" id="deckTitle"></h1>
      <span class="deck-sub" id="deckSub"></span>
    </div>
    <div class="tools">
      <button class="icon-btn" id="shuffleBtn" title="Shuffle" aria-label="Shuffle cards">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
        <span>Shuffle</span>
      </button>

  if(tab==="r"||tab==="b") tabs.push(`<circle cx="${x+w+r*.55}" cy="${y+h/2}" r="${r}"/>`);
  if(tab==="l"||tab==="b") tabs.push(`<circle cx="${x-r*.55}" cy="${y+h/2}" r="${r}"/>`);
  return `<g class="${cls}" fill="${fill}" opacity="${op}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${h*.18}"/>${tabs.join("")}</g>`;
};
const glyphs=(list,fill)=>list.map(([t,x,y,size,cls,op])=>`<text class="${cls}" x="${x}" y="${y}" font-size="${size}" font-weight="800" fill="${fill}" opacity="${op}" font-family="Manrope, Inter, system-ui, sans-serif">${t}</text>`).join("");
const THEMES = {
  prefix: `<svg viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
      <circle class="drift slow" cx="1000" cy="150" r="240" fill="#B58BEA" opacity=".45"/>
      <circle class="drift rev" cx="160" cy="680" r="260" fill="#7E43D0" opacity=".32"/>
      <circle class="drift" cx="620" cy="760" r="160" fill="#C3F570" opacity=".35"/>
      ${piece(120,140,260,130,"r","#7E43D0",.6,"drift")}
      ${piece(760,420,240,120,"r","#9A63E0",.55,"drift rev")}
      ${piece(420,560,200,100,"r","#0455F6",.35,"drift slow")}
      ${glyphs([["›",860,250,260,"drift",.35],["›",300,520,200,"drift rev",.3]],"#5B2FB0")}
    </svg>`,
  suffix: `<svg viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
      <circle class="drift" cx="200" cy="140" r="240" fill="#B58BEA" opacity=".45"/>
      <circle class="drift rev slow" cx="1040" cy="660" r="260" fill="#7E43D0" opacity=".32"/>
      <circle class="drift" cx="560" cy="80" r="150" fill="#C3F570" opacity=".3"/>
      ${piece(820,150,260,130,"l","#7E43D0",.6,"drift rev")}
      ${piece(180,430,240,120,"l","#9A63E0",.55,"drift")}
      ${piece(620,580,200,100,"l","#0455F6",.35,"drift slow")}
      ${glyphs([["‹",260,300,240,"drift rev",.32],["‹",960,560,200,"drift",.3]],"#5B2FB0")}
    </svg>`,
  root: `<svg viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
      <circle class="drift slow" cx="960" cy="640" r="260" fill="#9A63E0" opacity=".38"/>
      <circle class="drift rev" cx="220" cy="160" r="230" fill="#C3F570" opacity=".38"/>
      <circle class="drift" cx="620" cy="300" r="180" fill="#B58BEA" opacity=".35"/>
      ${piece(140,470,240,120,"b","#7E43D0",.55,"drift")}
      ${piece(760,170,250,125,"b","#9A63E0",.5,"drift rev")}
      ${glyphs([["/o",470,640,220,"drift slow",.32],["/o",900,500,150,"drift",.28],["/i",110,330,140,"drift rev",.26]],"#5B2FB0")}
    </svg>`,
  symbol: `<svg viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
      <circle class="drift" cx="1020" cy="180" r="250" fill="#7E43D0" opacity=".34"/>
      <circle class="drift rev slow" cx="180" cy="660" r="250" fill="#B58BEA" opacity=".45"/>
      <circle class="drift" cx="640" cy="720" r="170" fill="#C3F570" opacity=".32"/>
      ${glyphs([["↑",140,300,260,"drift",.35],["Δ",820,700,300,"drift rev",.3],["±",520,330,220,"drift slow",.28],["↓",1000,460,240,"drift",.32],["≠",300,720,200,"drift rev",.26],["°",760,220,260,"drift slow",.3]],"#5B2FB0")}
    </svg>`
};

/* fine-line white motifs for the card backs (rotate as a set) */
const MOTIFS = [
  `<svg class="motif" viewBox="0 0 130 110" fill="none" stroke="#fff" stroke-width="1.2">${[0,1,2,3,4,5].map(i=>`<line x1="${10+i*22}" y1="0" x2="${10+i*22}" y2="110"/><line x1="0" y1="${10+i*20}" x2="130" y2="${10+i*20}"/>`).join("")}<rect x="54" y="50" width="22" height="20" fill="#fff" stroke="none"/><rect x="98" y="90" width="22" height="20" fill="#C3F570" stroke="none"/></svg>`,
  `<svg class="motif" viewBox="0 0 130 110" fill="none" stroke="#fff" stroke-width="1.2"><line x1="0" y1="104" x2="130" y2="104"/>${[0,1,2,3,4].map(i=>`<rect x="${10+i*24}" y="${84-i*18}" width="14" height="${20+i*18}"/>`).join("")}<rect x="106" y="12" width="14" height="92" fill="#C3F570" stroke="none" opacity=".9"/></svg>`,
  `<svg class="motif" viewBox="0 0 130 110" fill="none" stroke="#fff" stroke-width="1.2">${[14,30,46,62,78].map((r,i)=>`<circle cx="110" cy="92" r="${r}" opacity="${1-i*.18}"/>`).join("")}<circle cx="110" cy="92" r="6" fill="#C3F570" stroke="none"/></svg>`
];

/* ---------- state ---------- */
let order = [], pos = 0, status = {}, currentTheme = null;
let deckMode = "all";

/* ---------- remember where the student left off (this browser only) ----------
   Cards are saved by a fingerprint of their content, not their number,
   so adding/removing/reordering cards later still resumes on the right card. */
const SAVE_KEY = "flashcards-progress:" + DECK.title;
const cardId = c => { const str = JSON.stringify(c); let h = 0; for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i))|0; } return "c" + (h>>>0).toString(36); };
const IDS = DECK.cards.map(cardId);
function save(){
  try{
    if(!order.length) return;
    const st = {}; Object.keys(status).forEach(k=>{ if(IDS[k]) st[IDS[k]] = status[k]; });
    localStorage.setItem(SAVE_KEY, JSON.stringify({v:1, mode:deckMode, order:order.map(i=>IDS[i]), pos, status:st, t:Date.now()}));
  }catch(e){}
}
function clearSave(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }
function loadSave(){
  try{
    const d = JSON.parse(localStorage.getItem(SAVE_KEY) || "null");
    if(!d || d.v!==1 || !Array.isArray(d.order)) return null;
    const idx = id => IDS.indexOf(id);
    let ord = d.order.map(idx).filter(i=>i>=0);
    if(d.mode!=="review") DECK.cards.forEach((_,i)=>{ if(!ord.includes(i)) ord.push(i); });   // new cards join the full deck
    if(!ord.length) return null;
    let p = ord.indexOf(idx(d.order[d.pos]));
    if(p<0) p = Math.max(0, Math.min(d.pos||0, ord.length-1));
    const st = {}; Object.entries(d.status||{}).forEach(([id,v])=>{ const i=idx(id); if(i>=0) st[i]=v; });
    if(p===0 && !Object.keys(st).length) return null;                                       // nothing worth resuming
    return {order:ord, pos:p, status:st, mode:d.mode==="review"?"review":"all"};
  }catch(e){ return null; }
}
const $ = id => document.getElementById(id);
const card = $("card");

/* build bg layers once */
Object.entries(THEMES).forEach(([k,svg])=>{
  const d=document.createElement("div"); d.className="layer"; d.dataset.theme=k; d.innerHTML=svg;
  $("world").insertBefore(d,$("world").querySelector(".veil"));
});

function setTheme(t){
  if(t===currentTheme) return;
  currentTheme=t;
  document.querySelectorAll(".layer").forEach(l=>l.classList.toggle("on",l.dataset.theme===t));
}

function fillLine(l, mode, c){
  let h=l;
  if(c.answers){
    c.answers.forEach((ans,i)=>{
      h=h.replace(`{${i+1}}`, mode==="front" ? `<span class="blank" aria-label="blank"></span>` : `<span class="ans">${ans}</span>`);
    });
  }
  return h.replace("{blank}", mode==="front"
      ? `<span class="blank" aria-label="blank"></span>`
      : `<span class="ans">${c.answer}</span>`);
}

function tableHTML(c, mode){
  const head = c.head ? `<thead><tr>${c.head.map(h=>`<th>${h}</th>`).join("")}</tr></thead>` : "";
  const body = c.rows.map(r=>`<tr>${r.map(cell=>{
      if(typeof cell==="string") return `<td>${cell}</td>`;
      return `<td>${mode==="front" ? `<span class="q">?</span>` : `<span class="ans">${cell.a}</span>`}</td>`;
    }).join("")}</tr>`).join("");
  return `<table class="ftable">${head}<tbody>${body}</tbody></table>`;
}

function faceHTML(c, mode, idx){
  let content;
  if(c.type==="table") content = tableHTML(c, mode);
  else if(c.type==="image"){
    const im = IMAGES[c.image];
    const marks = mode==="back" ? im.marks.map(m=>`<span class="mark" style="left:${m.l}%;top:${m.t}%;min-width:${m.w}%;height:${m.h}%"><span class="ans">${m.a}</span></span>`).join("") : "";
    content = `<figure class="nha"><div class="nha-wrap"><img src="${im.src}" alt="${c.label}" draggable="false">${marks}</div><figcaption>Image: NHA</figcaption></figure>`;
  }
  else if(c.type==="term"){
    const face = c.img ? `<img class="term-img" src="${SYMIMG[c.img]}" alt="${c.alt}" draggable="false">` : `<span>${c.term}</span>`;
    content = mode==="front"
      ? `<p class="term-word">${face}</p>`
      : `<span class="term-chip">${c.img ? `<img src="${SYMIMG[c.img]}" alt="${c.alt}" draggable="false">` : c.term}</span><p class="term-meaning"><span class="ans">${c.back}</span></p>`;
  }
  else {
    const src = (mode==="front" && c.frontLines) ? c.frontLines : c.lines;
    content = src.map(l=>`<p class="line${c.big?" big":""}">${fillLine(l,mode,c)}</p>`).join("");
  }
  const plain = !c.type || c.type==="term";   // corner motif only on text cards, so it never sits under a table or diagram
  return `
    <div class="side"><b>${mode==="front"?"Front":"Back"}</b><span class="hint">${mode==="front"?"Click to reveal":"Click to flip back"}</span></div>
    <div class="body${plain?"":" tight"}">
      ${c.label?`<span class="label">${c.label}</span>`:""}
      ${content}
      ${mode==="back"&&c.example?`<p class="example">${c.example}</p>`:""}
    </div>
    ${mode==="back"&&plain?MOTIFS[idx%MOTIFS.length]:""}`;
}

function render(dir){
  updateBadges();
  setTimeout(save,0);
  const ci = order[pos], c = DECK.cards[ci];
  card.classList.remove("flipped");
  $("rate").classList.remove("show");
  $("front").innerHTML = faceHTML(c,"front",ci);
  $("back").innerHTML  = faceHTML(c,"back",ci);
  setTheme(c.theme);

  const prevTopic = $("topic").dataset.t;
  if(prevTopic!==c.topic){
    $("topic").dataset.t=c.topic;
    $("topic").innerHTML=`<span class="in">${c.topic}</span>`;
  }

  if(dir){ card.classList.remove("enter-next","enter-prev"); void card.offsetWidth; card.classList.add(dir==="next"?"enter-next":"enter-prev"); }

  $("count").textContent = `${pos+1} of ${order.length}`;
  $("bar").style.width = `${((pos+1)/order.length)*100}%`;
  $("prevBtn").disabled = pos===0;
  $("dots").style.display = order.length>40 ? "none" : "";
  if(order.length<=40) $("dots").innerHTML = order.map((k,i)=>`<span class="dot ${i===pos?"here":""} ${status[k]||""}"></span>`).join("");
  $("flipBtn").textContent = "Flip card";
}

function flip(){
  if(typeof rating!=="undefined" && rating) return;   // card is on its way to a bucket
  card.classList.toggle("flipped");
  const on = card.classList.contains("flipped");
  $("rate").classList.toggle("show", on);
  $("flipBtn").textContent = on ? "Show front" : "Flip card";
}
function next(){ if(pos<order.length-1){pos++;render("next");} else finish(); }
function prev(){ if(pos>0){pos--;render("prev");} }
function updateBadges(){
  $("knowCountBadge").textContent  = order.filter(k=>status[k]==="known").length;
  $("learnCountBadge").textContent = order.filter(k=>status[k]==="learning").length;
}
let rating=false;
function rate(s){
  if(rating) return;                       // ignore double-clicks while a card is flying
  rating=true;
  status[order[pos]]=s; save();
  const btn = s==="known" ? $("knowBtn") : $("learnBtn");
  const badge = s==="known" ? $("knowCountBadge") : $("learnCountBadge");
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const done = ()=>{ updateBadges(); badge.classList.remove("bump"); void badge.offsetWidth; badge.classList.add("bump"); };
  if(reduce || !card.animate){ done(); setTimeout(()=>{ rating=false; next(); },350); return; }
  const from = card.getBoundingClientRect(), to = badge.getBoundingClientRect();
  const fly = document.createElement("div");
  fly.className = "fly "+s;
  Object.assign(fly.style,{left:from.left+"px",top:from.top+"px",width:from.width+"px",height:from.height+"px"});
  document.body.appendChild(fly);
  const sx = 34/from.width, sy = 24/from.height;
  const dx = to.left + to.width/2 - 17 - from.left, dy = to.top + to.height/2 - 12 - from.top;
  fly.animate([
    {transform:"translate(0,0) scale(1,1)", opacity:.85, borderRadius:"20px"},
    {transform:`translate(${dx*0.6}px,${dy*0.35}px) scale(${Math.max(sx,0.35)},${Math.max(sy,0.35)}) rotate(-6deg)`, opacity:.9, offset:.55},
    {transform:`translate(${dx}px,${dy}px) scale(${sx},${sy})`, opacity:.95, borderRadius:"60px"}
  ],{duration:520,easing:"cubic-bezier(.55,0,.3,1)"}).onfinish=()=>{
    fly.remove(); done();
    setTimeout(()=>{ rating=false; next(); },220);
  };
}

function start(list, mode, at){
  order = list; pos = at || 0; deckMode = mode || "all";
  $("intro").classList.add("hide"); $("finish").classList.add("hide");
  $("topic").dataset.t="";
  render("next"); card.focus({preventScroll:true});
}
const all = () => DECK.cards.map((_,i)=>i);
function shuffle(){
  const a=[...order]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  order=a; pos=0; $("topic").dataset.t=""; render("next");
}

function finish(){
  const known = order.filter(k=>status[k]==="known").length;
  const learning = order.filter(k=>status[k]==="learning");
  const pct = Math.round(known/order.length*100);
  $("knownCount").textContent = `Got it: ${known}`;
  $("learnCount").textContent = `Still learning: ${learning.length}`;
  $("reviewBtn").style.display = learning.length ? "" : "none";
  $("reviewBtn").onclick = ()=>start(learning,"review");
  clearSave();
  $("finish").classList.remove("hide");
  $("ringVal").style.strokeDashoffset = 377;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ $("ringVal").style.strokeDashoffset = 377*(1-pct/100); }));
  let n=0; const t=setInterval(()=>{ n=Math.min(pct,n+2); $("ringText").textContent=n+"%"; if(n>=pct)clearInterval(t); },20);
  if(pct>=50) confetti();
}

function confetti(){
  const cols=["#C3F570","#0455F6","#7E43D0","#DEEBFF","#F0E6FF"];
  for(let i=0;i<70;i++){
    const p=document.createElement("i"); p.className="confetti";
    p.style.left=Math.random()*100+"vw"; p.style.background=cols[i%cols.length];
    p.style.animationDuration=(2.2+Math.random()*2)+"s"; p.style.animationDelay=(Math.random()*.6)+"s";
    p.style.transform=`rotate(${Math.random()*360}deg)`;
    document.body.appendChild(p); setTimeout(()=>p.remove(),5000);
  }
}

/* ---------- wiring ---------- */
$("deckTitle").textContent = DECK.title;
$("deckSub").textContent = DECK.subtitle;
$("introTitle").textContent = DECK.title;
$("introSub").textContent = DECK.subtitle;
$("introMeta").textContent = `${DECK.cards.length} cards`;
setTheme(DECK.cards[0].theme);

$("startBtn").onclick = ()=>start(all(),"all");
$("againBtn").onclick = ()=>{ status={}; start(all(),"all"); };
$("restartBtn").onclick = ()=>{ status={}; start(all(),"all"); };
const saved = loadSave();
if(saved){
  $("resumeText").textContent = `Pick up at card ${saved.pos+1} of ${saved.order.length}?`;
  $("resumeBox").hidden = false; $("startRow").hidden = true;
  $("resumeBtn").onclick = ()=>{ status = saved.status; start(saved.order, saved.mode, saved.pos); };
  $("freshBtn").onclick  = ()=>{ clearSave(); status = {}; start(all(),"all"); };
}
$("shuffleBtn").onclick = shuffle;
$("flipBtn").onclick = flip;
$("nextBtn").onclick = next;
$("prevBtn").onclick = prev;
$("knowBtn").onclick = ()=>rate("known");
$("learnBtn").onclick = ()=>rate("learning");
card.onclick = flip;

document.addEventListener("keydown",e=>{
  if(!$("intro").classList.contains("hide")||!$("finish").classList.contains("hide")) return;
  if(e.key===" "||e.key==="Enter"){ if(e.target.tagName==="BUTTON"&&e.target!==card) return; e.preventDefault(); flip(); }
  if(e.key==="ArrowRight") next();
  if(e.key==="ArrowLeft") prev();
});

/* swipe on phones/tablets */
let sx=null;
card.addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});
card.addEventListener("touchend",e=>{
  if(sx===null) return; const dx=e.changedTouches[0].clientX-sx; sx=null;
  if(Math.abs(dx)>50){ e.preventDefault(); dx<0?next():prev(); }
});

/* ===================== FEEDBACK → Google Sheet =====================
   Responses go to a Google Form (its responses tab / linked Sheet).
   Until FEEDBACK.formAction is filled in, the feedback box stays hidden. */
const FEEDBACK = {
  formAction: "https://docs.google.com/forms/d/e/1FAIpQLSf-DMpZXCLlGMzv76I6oLq4z3DA-RmJBtrDU55_F_P0W8uBQQ/formResponse",            // e.g. "https://docs.google.com/forms/d/e/XXXX/formResponse"
  fields: {                  // the Google Form's entry IDs, e.g. "entry.123456789"
    name: "entry.1972710540", helped: "entry.1897717977", deck: "entry.2055860775", cohort: "entry.347922585", score: ""
  }
};
(function(){
  const box=$("fbk"); if(!FEEDBACK.formAction || !FEEDBACK.fields.name || !FEEDBACK.fields.helped) return;
  const SENT_KEY="flashcards-thumbs-sent:"+DECK.title;
  let helped="";
  const thumbs=[...box.querySelectorAll(".mood.thumb")];
  thumbs.forEach(b=>b.onclick=()=>{ helped=b.dataset.help; thumbs.forEach(x=>{ const on=x===b; x.classList.toggle("on",on); x.setAttribute("aria-checked",on); }); $("fbkMsg").textContent=""; });
  const showDone=name=>{ $("fbkForm").hidden=true; $("fbkDone").hidden=false; $("fbkDone").textContent = name ? `Thanks for your feedback, ${name}! 💙` : "Thanks for your feedback! 💙"; };
  let sentBefore=false; try{ sentBefore=!!localStorage.getItem(SENT_KEY); }catch(e){}
  if(sentBefore) return;            // already answered on an earlier visit: no feedback area at all
  box.hidden=false;
  // after they've sent it, the thank-you only shows until they start the deck again
  ["againBtn","reviewBtn","restartBtn"].forEach(id=>{ const b=$(id); if(b) b.addEventListener("click",()=>{ try{ if(localStorage.getItem(SENT_KEY)) box.hidden=true; }catch(e){} }); });
  $("fbkSend").onclick=async()=>{
    const name=$("fbkName").value.trim(), msg=$("fbkMsg");
    msg.className="fbk-msg";
    if(!helped){ msg.textContent="Tap 👍 or 👎 first."; msg.classList.add("err"); return; }
    if(!name){ msg.textContent="Please add your name."; msg.classList.add("err"); $("fbkName").focus(); return; }
    const known=Object.values(status).filter(v=>v==="known").length;
    const data=new URLSearchParams();
    const put=(k,v)=>{ if(FEEDBACK.fields[k]) data.append(FEEDBACK.fields[k],v); };
    put("name",name); put("helped",helped); put("deck",DECK.title);
    put("cohort", (new URLSearchParams(location.search).get("cohort")||"").trim().slice(0,80) || "Not set");
    put("score",`${known} of ${DECK.cards.length} got it`);
    $("fbkSend").disabled=true; msg.textContent="Sending…";
    try{
      await fetch(FEEDBACK.formAction,{method:"POST",mode:"no-cors",body:data});
      try{ localStorage.setItem(SENT_KEY,"1"); }catch(e){}
      showDone(name);
    }catch(e){
      msg.textContent="Couldn't send right now. Check your connection and try again."; msg.classList.add("err");
      $("fbkSend").disabled=false;
    }
  };
  $("fbkName").addEventListener("keydown",e=>{ if(e.key==="Enter") $("fbkSend").click(); });
})();
</script>
